server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;

  # Vite uses this base path for GitHub Pages and the Docker image.
  location = / {
    # Preserve the host and port (for example, localhost:8081).
    return 302 $scheme://$http_host/practice-testing/;
  }

  location /practice-testing/ {
    try_files $uri $uri/ /practice-testing/index.html;
  }

  location ~* ^/practice-testing/.*\.(js|css|png|jpg|jpeg|gif|svg|ico|pdf)$ {
    expires 7d;
    add_header Cache-Control "public";
  }
}
